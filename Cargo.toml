[package]
name = "this"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
glob = "0.3.4"
ratatui = "0.30.2"
regex = "1.13.1"
shellexpand = "3.1.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"